      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_M9cHcbdY7gSqHN0QhZ0j9w_MDmnbpRU
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: AIVANA_API_KEY
        sync: false
      - key: AIVANA_API_URL
        sync: false
